<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>チェックポイント滞在判定</title>
  <style>
    .map-container {
      position: relative;
      width: 1263px;
      height: 954px;
      border: 1px solid #ccc;
    }
    .map-image {
      width: 100%;
      height: auto;
    }
    .cursor, .marker {
      position: absolute;
      width: 30px;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    .cursor {
      z-index: 20;
    }
  </style>
</head>
<body>
  <h2>チェックポイント滞在で色が変わるマーカー</h2>
  <div class="map-container">
    <img src="your_updated_map.png" class="map-image" alt="地図">
    <img id="cursor" src="cursor.png" class="cursor" alt="現在地カーソル">
    <img id="cp0" class="marker" src="blue_marker.png">
    <img id="cp1" class="marker" src="blue_marker.png">
    <img id="cp2" class="marker" src="blue_marker.png">
  </div>

  <script>
    const mapWidth = 1263;
    const mapHeight = 954;

    const latNorth = 35.658734;
    const latSouth = 35.655442;
    const lonWest = 139.539832;
    const lonEast = 139.545234;

    const cursor = document.getElementById("cursor");

    const checkpoints = [
      { id: "cp0", lat: 35.657318, lon: 139.543567 },
      { id: "cp1", lat: 35.657241, lon: 139.542211 },
      { id: "cp2", lat: 35.656817, lon: 139.540553 }
    ];

    const stayTimers = Array(checkpoints.length).fill(null);
    const visited = Array(checkpoints.length).fill(false);

    function convertToMapCoords(lat, lon) {
      const x = ((lon - lonWest) / (lonEast - lonWest)) * mapWidth;
      const y = ((latNorth - lat) / (latNorth - latSouth)) * mapHeight;
      return { x, y };
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000; // 地球の半径[m]
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // マーカー初期位置
    checkpoints.forEach((cp, i) => {
      const { x, y } = convertToMapCoords(cp.lat, cp.lon);
      const marker = document.getElementById(cp.id);
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
    });

    function updatePosition(lat, lon) {
      const { x, y } = convertToMapCoords(lat, lon);
      if (x >= 0 && x <= mapWidth && y >= 0 && y <= mapHeight) {
        cursor.style.left = `${x}px`;
        cursor.style.top = `${y}px`;
        cursor.style.display = "block";
      } else {
        cursor.style.display = "none";
      }

      checkpoints.forEach((cp, i) => {
        const distance = haversine(lat, lon, cp.lat, cp.lon);
        if (!visited[i]) {
          if (distance <= 30) {
            if (!stayTimers[i]) {
              // 1分間滞在で橙マーカーに変更
              stayTimers[i] = setTimeout(() => {
                document.getElementById(cp.id).src = "orange_marker.png";
                visited[i] = true;
                stayTimers[i] = null;
              }, 60000);
            }
          } else {
            // 離れたらカウント中止
            if (stayTimers[i]) {
              clearTimeout(stayTimers[i]);
              stayTimers[i] = null;
            }
          }
        }
      });
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          updatePosition(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
          console.error("位置情報取得失敗:", error.message);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    } else {
      alert("このブラウザでは位置情報が使えません。");
    }
  </script>
</body>
</html>
